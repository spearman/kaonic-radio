# Kaonic iperf configuration file
# subGHz Range: [ 389500 - 1020000]
# 2.4GHz Range: [2400000 - 2483500]
# Maximum payload size: 2047 Bytes

# Iperf settings
[iperf]
# Module A = 0
# Module B = 1
module = 0
duration = 10
payload_size = 2047
timeout = 10
# Packets in flight in client round-trip mode (1 = stop-and-wait).
# The radio is half-duplex; keep this small (2-4) or echoes collide with new packets.
window = 1
# One-way test: the client streams packets and the server only counts them (set on both sides)
tx_only = false

# Radio Modules
[radio-0]
freq = 869535000
channel = 3
channel_spacing = 200000
tx_power = 14
modulation = "ofdm"

[radio-1]
freq = 2400000000
channel = 12
channel_spacing = 200000
tx_power = 18
modulation = "ofdm"

# List of modulation presets
[modulation.ofdm]
type = "ofdm"
opt = 0 # Option [0;3]
mcs = 6 # MCS [0;6]

[modulation.qpsk]
type = "qpsk"
chip_freq = 1
rate = 1

